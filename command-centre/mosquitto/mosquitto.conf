# Plain MQTT on all interfaces so the ESP32 nodes and the alert server can connect.
listener 1883 0.0.0.0
allow_anonymous true

# Keep retained messages (LWT status) and QoS 1 sessions across broker restarts.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
